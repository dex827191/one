name: Build SSH Protocol APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'gradle/**'
      - '.github/workflows/android.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.yaml'
      - 'bulid.yaml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '.github/workflows/android.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project is in repository root
        shell: bash
        run: |
          required=(gradlew settings.gradle.kts build.gradle.kts app/build.gradle.kts)
          for file in "${required[@]}"; do
            if [[ ! -f "$GITHUB_WORKSPACE/$file" ]]; then
              echo "Required project file missing from repository root: $file"
              exit 1
            fi
          done
          echo "Project files found directly in repository root. No ZIP extraction is used."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found in $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Prepare project for GitHub runner
        shell: bash
        run: |
          chmod +x ./gradlew
          rm -f local.properties
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          sed -i 's#gradle-9\.0\.0-bin\.zip#gradle-8.13-bin.zip#' gradle/wrapper/gradle-wrapper.properties

      - name: Download Onering Xray AAR
        shell: bash
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            'https://github.com/dharak36/xray-onering/raw/refs/heads/main/libv2ray.aar' \
            --output app/libs/libv2ray.aar
          unzip -t app/libs/libv2ray.aar
          echo 'Onering libv2ray.aar downloaded and validated.'

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSH-Protocol-Xray-Onering-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
